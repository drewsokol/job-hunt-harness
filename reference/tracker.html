<title>Job Hunt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a working ledger. Summary strip, tabs, then dense rows that become cards at phone width. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunk: #e8ecf2;
  --fg: #151a23;
  --muted: #5b6577;
  --line: #d5dbe5;
  --accent: #2348c9;
  --accent-ink: #ffffff;
  --strong: #0f7a4f;
  --good: #2348c9;
  --stretch: #8a5a00;
  --ok-bg: #e2f4ea; --ok-fg: #0d6b45;
  --warn-bg: #fdf0d5; --warn-fg: #7a4f00;
  --bad-bg: #fbe3e1; --bad-fg: #a3261b;
  --idle-bg: #e9ecf1; --idle-fg: #5b6577;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --surface: #171c26; --sunk: #1f2532; --fg: #e6eaf2; --muted: #98a2b5; --line: #2a3242;
    --accent: #7c9bff; --accent-ink: #0b1020; --strong: #4fd19a; --good: #8fa8ff; --stretch: #f0b44c;
    --ok-bg: #133325; --ok-fg: #6fdcaa; --warn-bg: #3a2c0f; --warn-fg: #f3c46b;
    --bad-bg: #3d1a17; --bad-fg: #ff9a8f; --idle-bg: #232a37; --idle-fg: #a0a9ba;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #171c26; --sunk: #1f2532; --fg: #e6eaf2; --muted: #98a2b5; --line: #2a3242;
  --accent: #7c9bff; --accent-ink: #0b1020; --strong: #4fd19a; --good: #8fa8ff; --stretch: #f0b44c;
  --ok-bg: #133325; --ok-fg: #6fdcaa; --warn-bg: #3a2c0f; --warn-fg: #f3c46b;
  --bad-bg: #3d1a17; --bad-fg: #ff9a8f; --idle-bg: #232a37; --idle-fg: #a0a9ba;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 20px; }
h1 { font: 700 clamp(26px, 4vw, 34px)/1.1 var(--font-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font: 600 24px/1.1 var(--font-mono); font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.stat.alert b { color: var(--warn-fg); }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tab { appearance: none; border: 0; background: none; color: var(--muted); font: 500 14px var(--font-body); padding: 10px 14px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tab .n { font-family: var(--font-mono); font-size: 12px; margin-left: 6px; color: var(--muted); }
.tab:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 12px; font: 500 13px var(--font-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.list { display: grid; gap: 8px; }
.row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 16px; }
.row.dim { opacity: 0.7; }
.row-main { min-width: 0; display: grid; gap: 4px; }
.row-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; }
.company { font-weight: 600; }
.title { color: var(--fg); text-decoration: none; }
.title:hover { text-decoration: underline; color: var(--accent); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 13px; }
.reason { margin: 2px 0 0; max-width: 72ch; }
.gaps { margin: 0; color: var(--muted); font-size: 13px; max-width: 72ch; }
.gaps b { color: var(--stretch); font-weight: 600; }
.note { margin: 0; font-size: 13px; color: var(--warn-fg); max-width: 72ch; }
.mynote { margin: 0; font-size: 13px; max-width: 72ch; white-space: pre-wrap; }
.mynote b { font-weight: 600; }
details.more { margin-top: 2px; }
details.more summary { cursor: pointer; color: var(--accent); font-size: 13px; font-weight: 500; width: fit-content; }
.desc { white-space: pre-wrap; font-size: 13px; line-height: 1.55; max-height: 420px; overflow: auto; background: var(--sunk); border-radius: 8px; padding: 12px; margin: 8px 0 0; max-width: 80ch; }
.notes-box { display: grid; gap: 4px; margin-top: 10px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); max-width: 80ch; }
.notes-box textarea { text-transform: none; letter-spacing: 0; font-size: 14px; line-height: 1.45; resize: vertical; }
.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-start; justify-content: flex-end; }

.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.fit-3 { background: var(--ok-bg); color: var(--ok-fg); }
.fit-2 { background: color-mix(in srgb, var(--good) 14%, transparent); color: var(--good); }
.fit-1 { background: var(--warn-bg); color: var(--warn-fg); }
.st-applied { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); }
.st-interviewing, .st-offer { background: var(--ok-bg); color: var(--ok-fg); }
.st-rejected, .st-withdrawn { background: var(--bad-bg); color: var(--bad-fg); }
.st-skipped, .st-review { background: var(--idle-bg); color: var(--idle-fg); }
.st-warn { background: var(--warn-bg); color: var(--warn-fg); }

button.btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; padding: 6px 12px; font: 500 13px var(--font-body); cursor: pointer; white-space: nowrap; }
button.btn:hover { border-color: var(--muted); }
button.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.btn.quiet { border-color: transparent; color: var(--muted); }
button.btn:disabled { opacity: 0.5; cursor: default; }
a.btn { display: inline-block; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: 500 13px var(--font-body); color: var(--fg); text-decoration: none; }

.inline { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
input, select, textarea { font: 14px var(--font-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; min-width: 0; }
input[type="date"] { font-family: var(--font-mono); font-size: 13px; padding: 4px 6px; }
select.compact { padding: 4px 6px; font-size: 13px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.panel h2 { font: 600 17px var(--font-display); margin: 0; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
.form-grid label { display: grid; gap: 4px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); }
.form-grid label.wide { grid-column: 1 / -1; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; }

.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--fg); font: 600 16px var(--font-display); margin-bottom: 4px; }
.banner { border-radius: 10px; padding: 10px 14px; background: var(--warn-bg); color: var(--warn-fg); font-size: 13px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 13px; z-index: 20; }
.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 8px 0 -2px; }

@media (max-width: 640px) {
  .row { grid-template-columns: minmax(0, 1fr); }
  .actions { justify-content: flex-start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <h1>Job Hunt</h1>
    <p class="sub">Roles Claude screens land in To review. Mark them applied when you submit, keep notes on each one, and log recruiter messages and connection requests under Outreach.</p>
  </header>

  <section class="strip" id="strip" aria-label="Summary"></section>
  <div id="banner"></div>

  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
const STATUS = {
  review: "To review", applied: "Applied", interviewing: "Interviewing", offer: "Offer",
  rejected: "Rejected", skipped: "Skipped", withdrawn: "Withdrawn",
};
const FIT = { 3: "Strong fit", 2: "Good fit", 1: "Stretch" };
const CHANNELS = ["LinkedIn connection", "LinkedIn message", "Email", "Referral ask", "Call", "Recruiter reply"];
const OUT_STATUS = { sent: "Sent", accepted: "Accepted", replied: "Replied", scheduled: "Scheduled", "no-reply": "No reply", closed: "Closed" };
const TABS = [
  ["review", "To review"], ["pipeline", "Applied"], ["outreach", "Outreach"], ["archive", "Archive"],
];

const state = { db: null, ready: false, failed: false, jobs: [], outreach: [], tab: "review", fitFilter: "all", form: null, open: new Set(), pending: false };

function readTab() { try { return localStorage.getItem("tab"); } catch { return null; } }
function saveTab(t) { try { localStorage.setItem("tab", t); } catch {} }
const remembered = (location.hash || "").slice(1) || readTab();
if (TABS.some(([k]) => k === remembered)) state.tab = remembered;

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const daysSince = (iso) => iso ? Math.floor((new Date(today()) - new Date(iso)) / 86400000) : null;
const fmtDate = (iso) => iso ? new Date(iso + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";

// Suggested ask: 85% of the way up a posted range (should become a profile setting).
function askFromPay(pay) {
  if (!pay) return null;
  const nums = [...String(pay).matchAll(/\$\s?(\d{2,3}(?:[.,]\d{1,3})?)\s?(k|K)?/g)].map((m) => {
    let v = parseFloat(m[1].replace(",", ""));
    if (m[2] || v < 1000) v = v < 1000 ? v * 1000 : v;
    return v;
  }).filter((v) => v >= 80000 && v <= 900000);
  if (nums.length < 2) return null;
  const lo = nums[0], hi = nums[1];
  if (hi <= lo) return null;
  return Math.round((lo + 0.85 * (hi - lo)) / 5000) * 5000;
}
const money = (n) => "$" + Math.round(n / 1000) + "k";

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => (t.hidden = true), 2200);
}

async function write(fn, okMsg) {
  if (!state.db) { toast("Open this page in claude.ai to save changes."); return; }
  try { await fn(state.db); if (okMsg) toast(okMsg); }
  catch (e) { toast(e?.code === "invalid_argument" ? "You don't have edit access to this tracker." : "Couldn't save. Try again in a moment."); }
}
const updateJob = (id, data, msg) => write((db) => db.collection("jobs").doc(id).update({ ...data, updated: today() }), msg);
const updateOut = (id, data, msg) => write((db) => db.collection("outreach").doc(id).update(data), msg);

/* ---------- derived ---------- */
const byStatus = (s) => state.jobs.filter((j) => j.status === s);
const pipeline = () => state.jobs.filter((j) => ["applied", "interviewing", "offer"].includes(j.status));
const dueFollowups = () => state.outreach.filter((o) => o.followUp && o.followUp <= today() && ["sent", "accepted"].includes(o.status));
const jobLabel = (id) => { const j = state.jobs.find((x) => x.id === id); return j ? `${j.company} · ${j.title}` : ""; };

/* ---------- render ---------- */
function renderStrip() {
  const applied = state.jobs.filter((j) => j.appliedDate);
  const last7 = applied.filter((j) => daysSince(j.appliedDate) <= 6).length;
  const stats = [
    [byStatus("review").length, "To review"],
    [applied.length, "Applications"],
    [last7, "Applied last 7 days"],
    [byStatus("interviewing").length + byStatus("offer").length, "Interviewing"],
    [byStatus("rejected").length, "Rejected"],
    [dueFollowups().length, "Follow-ups due", dueFollowups().length > 0],
  ];
  document.getElementById("strip").innerHTML = stats.map(([n, l, alert]) =>
    `<div class="stat${alert ? " alert" : ""}"><b>${state.ready ? n : "–"}</b><span>${l}</span></div>`).join("");
}

function renderTabs() {
  const counts = { review: byStatus("review").length, pipeline: pipeline().length, outreach: state.outreach.length,
    archive: state.jobs.filter((j) => ["rejected", "skipped", "withdrawn"].includes(j.status)).length };
  document.getElementById("tabs").innerHTML = TABS.map(([k, l]) =>
    `<button class="tab" role="tab" data-action="tab" data-tab="${k}" aria-selected="${state.tab === k}">${l}<span class="n">${state.ready ? counts[k] : ""}</span></button>`).join("");
}

function payLine(j) {
  if (!j.pay) return "";
  const ask = j.ask || askFromPay(j.pay);
  return `<span class="mono">${esc(j.pay)}</span>${ask ? ` <span class="mono" title="85% of the way up the posted range">· ask ${typeof ask === "number" ? money(ask) : esc(ask)}</span>` : ""}`;
}

function jobRow(j) {
  const fit = j.fit ? `<span class="pill fit-${j.fit}">${FIT[j.fit]}</span>` : "";
  const status = j.status !== "review" ? `<span class="pill st-${j.status}">${STATUS[j.status]}</span>` : "";
  const unconfirmed = j.unconfirmed ? `<span class="pill st-warn" title="Claude wasn't sure this was submitted">Confirm</span>` : "";
  const title = j.url ? `<a class="title" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a>` : `<span class="title">${esc(j.title)}</span>`;
  const meta = [
    j.location ? `<span>${esc(j.location)}</span>` : "",
    payLine(j) ? `<span>${payLine(j)}</span>` : "",
    j.posted && j.status === "review" ? `<span class="mono">posted ${fmtDate(j.posted)}</span>` : "",
    j.source && j.source !== "screener" ? `<span>${esc(j.source)}</span>` : "",
  ].filter(Boolean).join("");
  const outCount = state.outreach.filter((o) => o.jobId === j.id).length;

  let actions = "";
  if (j.status === "review") {
    actions = `<button class="btn primary" data-action="apply" data-id="${j.id}">Mark applied</button>
      <button class="btn" data-action="outreach-for" data-id="${j.id}">Log outreach</button>
      <button class="btn quiet" data-action="skip" data-id="${j.id}">Skip</button>`;
  } else {
    const opts = Object.entries(STATUS).filter(([k]) => k !== "review").map(([k, l]) => `<option value="${k}"${k === j.status ? " selected" : ""}>${l}</option>`).join("");
    actions = `<label class="inline">Applied <input type="date" id="ad-${j.id}" data-action="applied-date" data-id="${j.id}" value="${esc(j.appliedDate || "")}"></label>
      <select class="compact" id="st-${j.id}" data-action="status" data-id="${j.id}" aria-label="Status">${opts}</select>
      <button class="btn" data-action="outreach-for" data-id="${j.id}">Log outreach${outCount ? ` (${outCount})` : ""}</button>`;
    if (["skipped"].includes(j.status)) actions += `<button class="btn quiet" data-action="restore" data-id="${j.id}">Back to review</button>`;
  }
  const since = j.appliedDate && j.status === "applied" ? `<span class="mono">${daysSince(j.appliedDate)}d ago</span>` : "";
  return `<article class="row${["skipped", "rejected", "withdrawn"].includes(j.status) ? " dim" : ""}">
    <div class="row-main">
      <div class="row-head"><span class="company">${esc(j.company)}</span>${title}${fit}${status}${unconfirmed}${since}</div>
      ${meta ? `<div class="meta">${meta}</div>` : ""}
      ${j.reason ? `<p class="reason">${esc(j.reason)}</p>` : ""}
      ${j.gaps ? `<p class="gaps"><b>Gaps:</b> ${esc(j.gaps)}</p>` : ""}
      ${j.flag ? `<p class="note">${esc(j.flag)}</p>` : ""}
      ${j.notes ? `<p class="mynote"><b>Notes:</b> ${esc(j.notes)}</p>` : ""}
      <details class="more" data-id="${j.id}"${state.open.has(j.id) ? " open" : ""}>
        <summary>${j.description ? "Description and notes" : "Notes"}</summary>
        ${j.description ? `<div class="desc">${esc(j.description)}</div>` : ""}
        <label class="notes-box">Your notes<textarea id="nt-${j.id}" data-action="notes" data-id="${j.id}" rows="3" placeholder="Recruiter name, referral, what you emphasized, interview dates">${esc(j.notes || "")}</textarea></label>
      </details>
    </div>
    <div class="actions">${actions}</div>
  </article>`;
}

function emptyState(title, body) { return `<div class="empty"><strong>${title}</strong>${body}</div>`; }

function viewReview() {
  let jobs = byStatus("review");
  if (state.fitFilter !== "all") jobs = jobs.filter((j) => String(j.fit) === state.fitFilter);
  jobs.sort((a, b) => (b.fit || 0) - (a.fit || 0) || (b.askSort || askFromPay(b.pay) || 0) - (a.askSort || askFromPay(a.pay) || 0));
  const chips = [["all", "All"], ["3", "Strong"], ["2", "Good"], ["1", "Stretch"]].map(([k, l]) =>
    `<button class="chip" data-action="fit" data-fit="${k}" aria-pressed="${state.fitFilter === k}">${l}</button>`).join("");
  return `<div class="toolbar"><div class="filters">${chips}</div>
      <button class="btn" data-action="toggle-form" data-form="job">${state.form === "job" ? "Close" : "Add a role"}</button></div>
    ${state.form === "job" ? jobForm() : ""}
    <div class="list">${jobs.length ? jobs.map(jobRow).join("") : emptyState("Nothing to review", "Ask Claude to run the screener, or add a role you found yourself.")}</div>`;
}

function viewPipeline() {
  const groups = [["interviewing", "Interviewing"], ["offer", "Offers"], ["applied", "Waiting to hear back"]];
  const html = groups.map(([s, l]) => {
    const jobs = byStatus(s).sort((a, b) => (b.appliedDate || "").localeCompare(a.appliedDate || ""));
    return jobs.length ? `<p class="section-label">${l} · ${jobs.length}</p>${jobs.map(jobRow).join("")}` : "";
  }).join("");
  return `<div class="list">${html || emptyState("No applications yet", "Mark a role applied from To review and it will move here.")}</div>`;
}

function viewArchive() {
  const jobs = state.jobs.filter((j) => ["rejected", "skipped", "withdrawn"].includes(j.status))
    .sort((a, b) => (b.updated || "").localeCompare(a.updated || ""));
  return `<div class="list">${jobs.length ? jobs.map(jobRow).join("") : emptyState("Archive is empty", "Rejected, skipped and withdrawn roles collect here.")}</div>`;
}

function outRow(o) {
  const due = o.followUp && o.followUp <= today() && ["sent", "accepted"].includes(o.status);
  const opts = Object.entries(OUT_STATUS).map(([k, l]) => `<option value="${k}"${k === o.status ? " selected" : ""}>${l}</option>`).join("");
  const job = o.jobId ? jobLabel(o.jobId) : "";
  return `<article class="row">
    <div class="row-main">
      <div class="row-head"><span class="company">${esc(o.person || "Unknown")}</span>
        <span>${esc([o.personRole, o.company].filter(Boolean).join(", "))}</span>
        <span class="pill st-${o.status === "replied" || o.status === "accepted" || o.status === "scheduled" ? "interviewing" : o.status === "no-reply" || o.status === "closed" ? "skipped" : "applied"}">${OUT_STATUS[o.status] || o.status}</span>
        ${due ? `<span class="pill st-warn">Follow up</span>` : ""}</div>
      <div class="meta"><span>${esc(o.channel || "")}</span><span class="mono">${fmtDate(o.date)}</span>${job ? `<span>${esc(job)}</span>` : ""}</div>
      ${o.note ? `<p class="reason">${esc(o.note)}</p>` : ""}
    </div>
    <div class="actions">
      <label class="inline">Follow up <input type="date" id="fu-${o.id}" data-action="followup" data-id="${o.id}" value="${esc(o.followUp || "")}"></label>
      <select class="compact" id="os-${o.id}" data-action="out-status" data-id="${o.id}" aria-label="Outreach status">${opts}</select>
    </div>
  </article>`;
}

function viewOutreach() {
  const items = [...state.outreach].sort((a, b) => {
    const da = dueFollowups().includes(a) ? 0 : 1, dbb = dueFollowups().includes(b) ? 0 : 1;
    return da - dbb || (b.date || "").localeCompare(a.date || "");
  });
  return `<div class="toolbar"><span class="sub">Connection requests, messages, referral asks and recruiter threads.</span>
      <button class="btn primary" data-action="toggle-form" data-form="outreach">${state.form === "outreach" ? "Close" : "Log outreach"}</button></div>
    ${state.form === "outreach" ? outreachForm() : ""}
    <div class="list">${items.length ? items.map(outRow).join("") : emptyState("No outreach logged", "Log a connection request or message and set a follow-up date.")}</div>`;
}

function jobForm() {
  return `<form class="panel" id="job-form"><h2>Add a role</h2>
    <div class="form-grid">
      <label>Company<input id="jf-company" name="company" required></label>
      <label>Title<input id="jf-title" name="title" required></label>
      <label class="wide">Posting link<input id="jf-url" name="url" type="url" placeholder="https://"></label>
      <label>Pay range<input id="jf-pay" name="pay" placeholder="$200,000 – $260,000"></label>
      <label>Location<input id="jf-location" name="location" placeholder="Remote, US"></label>
      <label>Source<select id="jf-source" name="source"><option>LinkedIn</option><option>Recruiter</option><option>Agency</option><option>Referral</option><option>Company site</option></select></label>
      <label class="wide">Description<textarea id="jf-description" name="description" rows="3" placeholder="Paste the job description"></textarea></label>
      <label class="wide">Notes<input id="jf-notes" name="notes"></label>
    </div>
    <div class="form-actions"><button type="button" class="btn quiet" data-action="toggle-form" data-form="job">Cancel</button><button class="btn primary">Add role</button></div>
  </form>`;
}

function outreachForm() {
  const pre = state.outreachFor ? state.jobs.find((j) => j.id === state.outreachFor) : null;
  const jobOpts = state.jobs.filter((j) => j.status !== "skipped")
    .sort((a, b) => a.company.localeCompare(b.company))
    .map((j) => `<option value="${j.id}"${pre && pre.id === j.id ? " selected" : ""}>${esc(j.company)} · ${esc(j.title)}</option>`).join("");
  const plus7 = (() => { const d = new Date(today()); d.setDate(d.getDate() + 7); return d.toISOString().slice(0, 10); })();
  return `<form class="panel" id="out-form"><h2>Log outreach</h2>
    <div class="form-grid">
      <label>Person<input id="of-person" name="person" required></label>
      <label>Their role<input id="of-role" name="personRole" placeholder="Hiring manager, recruiter…"></label>
      <label>Company<input id="of-company" name="company" value="${esc(pre?.company || "")}"></label>
      <label>Channel<select id="of-channel" name="channel">${CHANNELS.map((c) => `<option>${c}</option>`).join("")}</select></label>
      <label>Date<input id="of-date" name="date" type="date" value="${today()}"></label>
      <label>Follow up on<input id="of-followup" name="followUp" type="date" value="${plus7}"></label>
      <label class="wide">Related role<select id="of-job" name="jobId"><option value="">None</option>${jobOpts}</select></label>
      <label class="wide">Note<textarea id="of-note" name="note" rows="2" placeholder="What you sent or asked for"></textarea></label>
    </div>
    <div class="form-actions"><button type="button" class="btn quiet" data-action="toggle-form" data-form="outreach">Cancel</button><button class="btn primary">Save</button></div>
  </form>`;
}

function render() {
  renderStrip(); renderTabs();
  const banner = document.getElementById("banner");
  banner.innerHTML = state.failed ? `<div class="banner">This tracker's data loads only inside claude.ai. Open the artifact link there to see and update your roles.</div>` : "";
  const view = document.getElementById("view");
  if (!state.ready && !state.failed) { view.innerHTML = emptyState("Loading your tracker", "Roles, applications and outreach will appear here."); return; }
  view.innerHTML = state.tab === "review" ? viewReview() : state.tab === "pipeline" ? viewPipeline() : state.tab === "outreach" ? viewOutreach() : viewArchive();
}

/* ---------- events ---------- */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.tagName === "SELECT" || el.tagName === "INPUT") return;
  const { action, id } = el.dataset;
  if (action === "tab") { state.tab = el.dataset.tab; state.form = null; saveTab(state.tab); render(); }
  else if (action === "fit") { state.fitFilter = el.dataset.fit; render(); }
  else if (action === "toggle-form") { state.form = state.form === el.dataset.form ? null : el.dataset.form; if (!state.form) state.outreachFor = null; render(); }
  else if (action === "apply") updateJob(id, { status: "applied", appliedDate: today() }, "Marked applied today. Change the date under Applied if needed.");
  else if (action === "skip") updateJob(id, { status: "skipped" }, "Skipped. It's in Archive if you change your mind.");
  else if (action === "restore") updateJob(id, { status: "review" }, "Moved back to To review.");
  else if (action === "outreach-for") { state.outreachFor = id; state.tab = "outreach"; state.form = "outreach"; render(); document.getElementById("of-person")?.focus(); }
});

document.addEventListener("change", (e) => {
  const el = e.target; const { action, id } = el.dataset || {};
  if (action === "status") updateJob(id, { status: el.value, ...(el.value !== "applied" ? {} : {}) }, `Status set to ${STATUS[el.value]}.`);
  else if (action === "applied-date") updateJob(id, { appliedDate: el.value, unconfirmed: false }, "Applied date saved.");
  else if (action === "followup") updateOut(id, { followUp: el.value }, "Follow-up date saved.");
  else if (action === "out-status") updateOut(id, { status: el.value }, `Marked ${OUT_STATUS[el.value].toLowerCase()}.`);
  else if (action === "notes") updateJob(id, { notes: el.value.trim() }, "Notes saved.");
});

// Remember which descriptions are expanded so live updates don't collapse them.
document.addEventListener("toggle", (e) => {
  const d = e.target;
  if (!d.matches || !d.matches("details.more")) return;
  if (d.open) state.open.add(d.dataset.id); else state.open.delete(d.dataset.id);
}, true);

// Don't redraw while the viewer is typing; catch up when they leave the field.
function safeRender() {
  const a = document.activeElement;
  if (a && a.closest && a.closest("#view") && (a.tagName === "TEXTAREA" || (a.tagName === "INPUT" && a.type !== "date"))) { state.pending = true; return; }
  render();
}
document.addEventListener("focusout", () => { if (state.pending) { state.pending = false; setTimeout(render, 0); } });

document.addEventListener("submit", (e) => {
  e.preventDefault();
  const f = new FormData(e.target); const data = Object.fromEntries(f.entries());
  if (e.target.id === "job-form") {
    write((db) => db.collection("jobs").add({ ...data, status: "review", added: today(), updated: today() }), "Role added to To review.");
  } else if (e.target.id === "out-form") {
    if (!data.company && data.jobId) data.company = state.jobs.find((j) => j.id === data.jobId)?.company || "";
    write((db) => db.collection("outreach").add({ ...data, status: "sent" }), "Outreach logged.");
  }
  state.form = null; state.outreachFor = null; render();
});

/* ---------- data ---------- */
render();
(async () => {
  const db = await window.claude?.use?.("db");
  if (!db) { state.failed = true; render(); return; }
  state.db = db;
  let got = 0;
  const done = () => { if (++got >= 2) state.ready = true; render(); };
  const onErr = () => { state.failed = true; render(); };
  let first = { jobs: true, outreach: true };
  db.collection("jobs").limit(1000).onSnapshot((snap) => {
    state.jobs = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (first.jobs) { first.jobs = false; done(); } else safeRender();
  }, onErr);
  db.collection("outreach").limit(1000).onSnapshot((snap) => {
    state.outreach = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    if (first.outreach) { first.outreach = false; done(); } else safeRender();
  }, onErr);
})();
</script>
