# Builds features from specs (decision 0011): implement, check, review, fix,
# up to 10 rounds. It asks the owners on the PR (label needs-owner-input)
# when it can't decide, and labels the PR final-review when the checks and
# the review pass. Owners merge.
#
# It starts when:
# - a new spec lands on main (merging a spec PR); the first new spec in the
#   push is built;
# - an owner runs it by hand with a spec's path;
# - an owner comments on a build PR with a command as the comment's whole
#   first line: /continue (carry on, with the comments since as answers),
#   /restart (build again from the spec), or /stop (close the PR).
#
# Owners are listed in the OWNERS repository variable (a JSON array of
# logins); nobody else can start it.
#
# Three jobs, so the token that can write never sits next to code Claude
# wrote:
# - prepare (can write; runs .github/scripts/prepare.sh from main, which
#   only calls GitHub's API) makes the branch and the PR, or checks the
#   command;
# - build (read only) runs Claude and the checks, in rounds, and leaves its
#   results as an artifact (.github/scripts/build.sh);
# - publish (can write; runs .github/scripts/publish.sh from main) checks
#   those results, then pushes the branch and posts the comments.
# One build job runs at a time; GitHub keeps one more waiting and cancels
# any beyond that. Pushes made with the workflow's token don't start CI, so
# publish starts CI on the branch when the build is ready.

name: Build

on:
  push:
    branches: [main]
    paths:
      - "docs/specs/**"
  workflow_dispatch:
    inputs:
      spec:
        description: "Spec to build, such as docs/specs/0001-short-name.md"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.repository_owner == 'drewsokol' && (
        (github.event_name == 'push' &&
          contains(fromJSON(vars.OWNERS || '[]'), github.actor)) ||
        (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main' &&
          contains(fromJSON(vars.OWNERS || '[]'), github.actor) &&
          contains(fromJSON(vars.OWNERS || '[]'), github.triggering_actor)) ||
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          github.event.issue.state == 'open' &&
          contains(fromJSON(vars.OWNERS || '[]'), github.event.comment.user.login) &&
          (github.event.comment.body == '/continue' ||
            startsWith(github.event.comment.body, fromJSON('"/continue\n"')) ||
            startsWith(github.event.comment.body, fromJSON('"/continue\r"')) ||
            github.event.comment.body == '/restart' ||
            startsWith(github.event.comment.body, fromJSON('"/restart\n"')) ||
            startsWith(github.event.comment.body, fromJSON('"/restart\r"'))))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # the feature branch
      pull-requests: write # the PR
      issues: write # labels and reactions
    outputs:
      mode: ${{ steps.prepare.outputs.mode }}
      pr: ${{ steps.prepare.outputs.pr }}
      branch: ${{ steps.prepare.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: .github
          persist-credentials: false

      - name: Decide what to build
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_SPEC: ${{ inputs.spec }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ID: ${{ github.event.comment.id }}
          ISSUE: ${{ github.event.issue.number }}
        run: bash .github/scripts/prepare.sh

  build:
    needs: prepare
    if: needs.prepare.outputs.mode == 'start' || needs.prepare.outputs.mode == 'continue' || needs.prepare.outputs.mode == 'restart'
    # At the job level, so comments that aren't commands never join it.
    concurrency:
      group: build
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Rounds stop starting after BUDGET_MINUTES (200); one round can take
    # about two hours more.
    timeout-minutes: 340
    permissions:
      contents: read
      pull-requests: read # the owners' comments and the decisions so far
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: work
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: work/go.mod
          # No cache: this job runs on main's ref, so a cache it saved would
          # be restored by trusted jobs (publish, release).
          cache: false

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.302

      - name: Build
        env:
          MODE: ${{ needs.prepare.outputs.mode }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          OWNERS: ${{ vars.OWNERS }}
          REPO: ${{ github.repository }}
          READ_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          export OUT="$RUNNER_TEMP/out"
          bash trusted/.github/scripts/build.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: build-results
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [prepare, build]
    # Also after a failed or cancelled build, to tell the owners.
    if: >-
      always() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.mode == 'start' || needs.prepare.outputs.mode == 'continue' || needs.prepare.outputs.mode == 'restart')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the feature branch
      pull-requests: write # the PR's comments and description
      issues: write # labels
      actions: write # starting CI on the branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: trusted/go.mod
          cache: false # the scanner needs only the standard library

      - name: Build the privacy scanner from main
        working-directory: trusted
        run: go build -o "$RUNNER_TEMP/privacyscan" ./internal/tools/privacyscan

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # a build that failed early leaves none
        with:
          name: build-results
          path: ${{ runner.temp }}/out

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNERS: ${{ vars.OWNERS }}
          MODE: ${{ needs.prepare.outputs.mode }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          export OUT="$RUNNER_TEMP/out" SCANNER="$RUNNER_TEMP/privacyscan"
          bash trusted/.github/scripts/publish.sh

  stop:
    if: >-
      github.repository_owner == 'drewsokol' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.issue.state == 'open' &&
      contains(fromJSON(vars.OWNERS || '[]'), github.event.comment.user.login) &&
      (github.event.comment.body == '/stop' ||
        startsWith(github.event.comment.body, fromJSON('"/stop\n"')) ||
        startsWith(github.event.comment.body, fromJSON('"/stop\r"')))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
      actions: write # cancelling a build that's running
    steps:
      - name: Stop the build
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          read -r head fork labels < <(gh pr view "$PR" --repo "$REPO" --json headRefName,isCrossRepository,labels --jq '.headRefName + " " + (.isCrossRepository|tostring) + " " + ([.labels[].name] | join(","))')
          if [[ "$head" != spec/* || "$fork" != false ]]; then
            gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=confused >/dev/null
            exit 0
          fi
          gh api "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=+1 >/dev/null
          # Closed first: a cancelled run's publish job finds the PR closed
          # and leaves it alone.
          gh pr edit "$PR" --repo "$REPO" --remove-label building --remove-label needs-owner-input --remove-label final-review >/dev/null || true
          gh pr close "$PR" --repo "$REPO" --comment "Stopped by an owner. The branch $head is kept; delete it when it's no longer needed."
          # The PR description names the run building it (prepare.sh), so
          # only that run is cancelled.
          if [[ ",$labels," == *,building,* ]]; then
            id=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body | sed -n 's/^<!-- build-run: \([0-9]*\) -->$/\1/p' | tail -n 1)
            if [ -n "$id" ] && [ "$id" != "$GITHUB_RUN_ID" ]; then
              gh run cancel "$id" --repo "$REPO" || true
            fi
          fi
